# Diagnostico de rendimiento en Windows y Linux a la par. Solo en la rama
# perfil-windows; no corre en main.
on:
  push:
    branches: [perfil-windows]

name: perfil-windows.yaml

permissions: read-all

jobs:
  perfil:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: local::.
      - name: Perfilar
        run: Rscript .github/perfil-windows.R
