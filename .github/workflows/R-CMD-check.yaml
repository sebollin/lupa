# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          # macOS no esta en esta matriz y no es un olvido. El trabajo
          # `macos-latest` moria siempre en `setup-r-dependencies`: `pak`
          # baja un binario y despues no puede abrirlo (`Cannot extract ...
          # unknown archive type`), asi que `R CMD check` no llegaba a
          # correr ni una vez. Un trabajo que no corre el check no dice que
          # el paquete pase ni que falle: no dice nada, y en rojo permanente
          # ensena a mirar para otro lado cuando se ponga rojo alguno de
          # los que si miden. macOS se mide en `macos.yaml`, que instala
          # las dependencias con install.packages() sin pasar por `pak`.
          # Si se vuelve a agregar aca, comprobar primero que el log del
          # trabajo contenga `Status:`; si no lo contiene, no midio.
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
