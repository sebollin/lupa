# Verifica la superficie DBI contra motores REALES levantados como servicios.
#
# Existe porque la fila "probado contra el motor real" de la tabla de motores de
# los README dependia de que alguien se acordara de correrlo a mano: se media
# una vez, quedaba en notas, y la tabla envejecia sin avisar. Ahora se rehace en
# cada push.
#
# PostgreSQL y MariaDB corren como servicios de GitHub Actions. Los que exigen
# un cliente propietario -Oracle, SQL Server- se verifican a mano y su fila de la
# tabla dice con que fecha; meterlos aca pediria credenciales o imagenes que no
# corresponde poner en un repositorio publico.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: motores.yaml

permissions: read-all

jobs:
  motores:
    runs-on: ubuntu-latest
    name: ${{ matrix.motor }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - motor: postgres
            paquete: RPostgres
          - motor: mariadb
            paquete: RMariaDB

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lupa
          POSTGRES_PASSWORD: lupa_ci
          POSTGRES_DB: lupa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lupa"
          --health-interval 10s --health-timeout 5s --health-retries 10
      mariadb:
        image: mariadb:11
        env:
          MARIADB_USER: lupa
          MARIADB_PASSWORD: lupa_ci
          MARIADB_DATABASE: lupa
          MARIADB_ROOT_PASSWORD: lupa_ci_root
        ports: ["3306:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s --health-timeout 5s --health-retries 10

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      LUPA_MOTOR: ${{ matrix.motor }}
      LUPA_DB_HOST: 127.0.0.1
      LUPA_DB_NAME: lupa
      LUPA_DB_USER: lupa
      LUPA_DB_PASS: lupa_ci

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Las cabeceras del cliente que cada controlador necesita para compilar.
      # Sin esto `RMariaDB` no instala, y ese fue justamente el motivo por el que
      # este frente quedo sin cubrir tanto tiempo.
      - name: Instalar cabeceras del cliente
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev libmariadb-dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::DBI
            any::${{ matrix.paquete }}
            local::.

      - name: Verificar contra el motor
        run: Rscript benchmark/verificar_motor.R
